# selene standard library for CET Lua mods: Lua 5.1 (LuaJIT) plus the CET and game globals our mods use.
# Keep in sync with typings/cet/cet.lua.
base: lua51
name: cet
globals:
  Game:
    any: true
  GetAllBlackboardDefs:
    args: []
  registerForEvent:
    args:
      - type: string
      - type: function
  registerHotkey:
    args:
      - type: string
      - type: string
      - type: function
  Transform:
    any: true
  registerInput:
    args:
      - type: string
      - type: string
      - type: function
  GetMod:
    args:
      - type: string
  Vector4:
    any: true
  Quaternion:
    any: true
  PSMImpulse:
    any: true
  ToVariant:
    args:
      - type: any
  SimpleScreenMessage:
    any: true
  SoundPlayEvent:
    any: true
  gamedataStatType:
    any: true
  Observe:
    args:
      - type: string
      - type: string
      - type: function
  gameinputActionType:
    any: true
  gameStatModifierType:
    any: true
  RPGManager:
    any: true
