# Install with `uv run pre-commit install`. Snapshots are recorded data, so no hook touches them.
exclude: ^snapshots/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^datasets/ # recorded data, kept as plain JSONL
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github

  - repo: local
    hooks:
      - id: selene
        name: selene (strict; settings in selene.toml, cet.yml)
        language: system
        entry: tools/selene
        types: [lua]

      - id: lua-language-server
        name: lua-language-server (strict; settings in .luarc.json, typings/cet)
        language: system
        entry: tools/luals
        types: [lua]
        pass_filenames: false

      - id: pyright
        name: pyright (strict; settings in pyproject.toml)
        language: node
        additional_dependencies: ["pyright@1.1.414"]
        entry: pyright
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        entry: uv run --frozen pytest -q
        types: [python]
        pass_filenames: false
