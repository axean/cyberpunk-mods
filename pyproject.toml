[project]
name = "modding-tools"
version = "0.1.0"
description = "Game modding tools and notes: Cyberpunk 2077 mods, Mirror's Edge as parkour reference."
readme = "README.md"
authors = [{ name = "Axel E. Andersson" }]
requires-python = ">=3.12"
dependencies = ["lz4>=4.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "pre-commit>=4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["tools", "tests", "typings"]
extraPaths = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "--import-mode=importlib"
